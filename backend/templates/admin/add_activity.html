{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
<div style="max-width:600px; margin:20px auto; padding:20px; background:#fff; border:1px solid #ddd; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.1);">
    <h1 style="margin-bottom:20px;">Add Activity for Order #{{ order.id }}</h1>

    <form method="post">{% csrf_token %}
        <div style="margin-bottom:15px;">
            {{ form.action.label_tag }}
            {{ form.action }}
        </div>

        <button type="submit" class="button button-primary">Save Activity</button>
        <a href="../../{{ order.id }}/change/" class="button" style="margin-left:10px;">Cancel</a>
    </form>
</div>
{% endblock %}
